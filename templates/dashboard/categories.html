{% extends 'base.html' %}

{% block content %}

<div class="row">
    <!-- Left sidebar  -->
      <!-- Load sidebar here -->
     {%  include 'dashboard/sidebar.html'%}

    <!-- Right side content -->
        <div class="col-md-9">
            <h2> All Categories</h2>
            <a href="{% url 'add_category'%}" class="btn btn-dark text-light float-right bm-2">Add New</a>
            <table class="table">
                <thead>
                    <tr>
                    <th scope="col">#</th>
                    <th scope="col">Category Name</th>
                    <th scope="col">Created At</th>
                    <th scope="col">Updated At</th>
                    <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                {% for cat in categories  %}
                    <tr>
                        <td>{{ forloop.counter}}</td>
                        <td>{{ cat }}</td>
                        <td>{{ cat.created_at }}</td>
                        <td>{{ cat.updated_at }}</td>  
                        <td>
                            <a href=""><i class="fa fa-edit text-success"></i></a>
                            &nbsp;
                            <a href=""><i class="fa fa-trash text-danger"></i></a>
                        </td>
                    </tr>
                {% endfor%}
                    
                </tbody>
            </table>
       
        </div>
</div>

{% endblock %}
